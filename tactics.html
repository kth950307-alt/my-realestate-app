<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도약 전술판 | DOYAK TACTICS</title>
<meta name="description" content="도약 농구팀 웹 전술판 — 선수를 끌어 움직이고, 다음 페이지를 눌러 이어 붙이고, 전체 재생만 누르면 됩니다. 링크 한 줄로 팀원과 공유.">
<meta name="theme-color" content="#16244B">
<meta property="og:title" content="도약 전술판">
<meta property="og:description" content="움직이고 → 다음 페이지 → 전체 재생. 링크 하나로 팀원과 공유하는 농구 작전판">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E8682B'/%3E%3Cpath d='M2 16h28M16 2v28' stroke='%2316244B' stroke-width='2'/%3E%3Cpath d='M6 7q10 9 0 18M26 7q-10 9 0 18' stroke='%2316244B' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 도약 전술판 — DOYAK TACTICS BOARD (v2 · 페이지 방식) */
:root{
  --navy:#16244B;
  --navy2:#1C347E;
  --ink:#20304F;
  --orange:#E8682B;
  --orange-d:#C4531C;
  --cream:#F6E8CD;
  --paint:#F5CDAB;
  --bg:#F2EDE3;
  --card:#FFFFFF;
  --line:#E9E0CF;
  --muted:#6E7A8F;
  --green:#2F7D5B;
  --blue-line:#E3E8F4;
  --shadow:0 8px 24px rgba(22,36,75,.07), 0 1px 2px rgba(22,36,75,.05);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:var(--bg);
  background-image:radial-gradient(1100px 520px at 50% -8%,#FCFAF4 0%,rgba(252,250,244,0) 70%);
  color:var(--navy);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit}
h1,h2,h3{letter-spacing:-.02em}
.ico{width:16px;height:16px;flex:0 0 auto;display:block}

.app{min-height:100dvh;display:flex;flex-direction:column}

/* ── 상단 바 ── */
.topbar{
  display:flex;align-items:center;gap:12px;padding:10px 18px;
  background:linear-gradient(180deg,#1B2C57 0%,#16244B 100%);
  color:#fff;box-shadow:0 2px 14px rgba(16,26,50,.22);
  position:relative;z-index:5;
}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--orange) 0%,#F0A05E 35%,rgba(232,104,43,0) 75%)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;background:#243766;border-radius:11px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.logo svg{width:23px;height:23px;display:block}
.brand-txt{min-width:0}
.brand-txt h1{margin:0;font-size:19px;font-weight:900;letter-spacing:-.03em;line-height:1.15;white-space:nowrap}
.brand-txt p{margin:1px 0 0;font-size:8.5px;font-weight:700;letter-spacing:.19em;color:#9FB0D6;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:9px;margin-left:auto}
.team-chip{font-size:9.5px;font-weight:900;letter-spacing:.13em;color:#C6D1EC;border:1px solid rgba(198,209,236,.3);padding:5px 8px;border-radius:7px;white-space:nowrap}
.btn-share{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--orange);color:#fff;border:0;border-radius:11px;
  padding:9px 15px;font-size:12.5px;font-weight:900;cursor:pointer;
  box-shadow:0 3px 12px rgba(232,104,43,.4);transition:transform .12s,background .15s;white-space:nowrap;
}
.btn-share:hover{background:#DE5D22}
.btn-share:active{transform:translateY(1px)}

/* ── 레이아웃 ── */
.layout{
  flex:1;min-height:0;width:100%;max-width:1340px;margin:0 auto;
  display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px;
}
.stage{display:flex;flex-direction:column;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.pad{padding:12px 14px}
.board{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}

/* ── 도구 막대 ── */
.toolbar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid #F0E9DA;background:#FCFAF5;flex-wrap:wrap}
.tools{display:flex;gap:3px}
.tools-end{padding-left:6px;border-left:1px solid #EDE4D3}
.tool{
  display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:10px;
  border:1px solid transparent;background:transparent;color:#4A5872;
  font-size:12px;font-weight:800;cursor:pointer;transition:background .14s,color .14s,box-shadow .14s;white-space:nowrap;
}
.tool:hover{background:#F1EADB;color:var(--navy)}
.tool[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:0 3px 9px rgba(22,36,75,.24)}
.tool[aria-pressed="true"]:hover{background:var(--navy)}
.seg{display:inline-flex;background:#EFE7D8;border-radius:11px;padding:3px;gap:2px;margin-left:auto;flex:0 0 auto}
.seg button{border:0;background:transparent;color:#5A6780;font-size:11.5px;font-weight:900;padding:6px 11px;border-radius:9px;cursor:pointer;transition:.15s}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(22,36,75,.16)}

.hintline{font-size:11px;color:#958C7C;padding:6px 12px 0;line-height:1.4}
.hintline b{color:var(--orange-d)}

/* ── 코트 ── */
.court-holder{
  flex:1;min-height:0;position:relative;margin:2px 10px 8px;border-radius:14px;
  background:#FBF7EE;box-shadow:inset 0 0 0 1px #F1E8D7;
}
#board{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
#courtLayer{filter:drop-shadow(0 3px 8px rgba(120,88,45,.16))}
#courtLayer .paint{fill:var(--paint);opacity:.72}
#courtLayer .ln{fill:none;stroke:var(--navy2);stroke-width:.28;stroke-opacity:.85;stroke-linecap:round}
#courtLayer .ln.dash{stroke-dasharray:.72 .66}
#courtLayer .boundary{fill:none;stroke:var(--navy2);stroke-width:.46;stroke-opacity:.95}
#courtLayer .boardline{stroke:#16244B;stroke-width:.44;stroke-linecap:round}
#courtLayer .hoop{fill:none;stroke:var(--orange);stroke-width:.28}
#courtLayer .clabel{font-size:1.45px;fill:#AC8A5C;text-anchor:middle;font-weight:800;opacity:.72;letter-spacing:.02em}
#courtLayer .wmark{font-size:5px;fill:#16244B;opacity:.032;text-anchor:middle;font-weight:900;letter-spacing:1.1px}

#linesLayer line,#linesLayer path{pointer-events:none}
#tempLayer line,#tempLayer path{pointer-events:none}
#playersLayer .tok{cursor:grab;pointer-events:all;filter:drop-shadow(0 1px 2px rgba(22,36,75,.28))}
#playersLayer .tok.dragging{cursor:grabbing}
#playersLayer .tok.dragging .disc{stroke-width:.5}
.tok .disc{stroke-linejoin:round}
.tok.def .disc{fill:var(--navy2);stroke:#fff;stroke-width:.26}
.tok.def .lbl{fill:#fff}
.tok.off .disc{fill:#FFF8EE;stroke:var(--orange);stroke-width:.36}
.tok.off .lbl{fill:var(--orange-d)}
.tok .lbl{font-size:1.82px;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tok .hit{fill:transparent;pointer-events:all}
body.drawing #playersLayer .tok{pointer-events:none}
body.drawing #board{cursor:crosshair}
body.dragging #board{cursor:grabbing}

/* ── 페이지 바 (메인 컨트롤) ── */
.pagebar{background:#F5F7FD;border-top:1px solid var(--blue-line);padding:9px 11px 11px}
.pb-head{display:flex;align-items:center;gap:8px;min-width:0}
.pb-label{font-size:10px;font-weight:900;letter-spacing:.08em;color:#7A87A6;flex:0 0 auto}
.ptabs{display:flex;gap:5px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:1px}
.ptabs::-webkit-scrollbar{display:none}
.ptab{
  flex:0 0 auto;min-width:38px;height:38px;padding:0 6px;border-radius:11px;
  border:1px solid #DCE2F0;background:#fff;color:#3B4A6B;
  font-size:14px;font-weight:900;cursor:pointer;transition:.15s;font-variant-numeric:tabular-nums;
}
.ptab:hover{background:#EEF2FB;border-color:#C3CDE4}
.ptab.on{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 3px 10px rgba(232,104,43,.32)}
.btn-add{
  display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;height:38px;padding:0 13px;
  border-radius:11px;border:1.5px solid var(--navy2);background:var(--navy2);color:#fff;
  font-size:12.5px;font-weight:900;cursor:pointer;transition:.15s;white-space:nowrap;
  box-shadow:0 3px 10px rgba(28,52,126,.26);
}
.btn-add:hover{background:#16295F;border-color:#16295F}
.btn-add .ico{width:14px;height:14px}

.pb-foot{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
.btn-play{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:42px;padding:0 17px;border-radius:12px;border:0;
  background:var(--orange);color:#fff;font-size:13.5px;font-weight:900;cursor:pointer;
  box-shadow:0 4px 13px rgba(232,104,43,.34);transition:.15s;
}
.btn-play:hover{background:#DC5D22}
.btn-play.playing{background:var(--navy);box-shadow:0 4px 13px rgba(22,36,75,.3)}
.btn-play .ico{width:15px;height:15px}
.btn-del{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:42px;padding:0 12px;border-radius:12px;border:1px solid #E6DACB;background:#fff;
  color:#9A6A56;font-size:12px;font-weight:800;cursor:pointer;transition:.15s;white-space:nowrap;
}
.btn-del:hover{background:#FBF2EC;border-color:#DEC7B6}
.btn-del .ico{width:14px;height:14px}
.btn-del:disabled{opacity:.38;cursor:default}
.btn-del:disabled:hover{background:#fff;border-color:#E6DACB}
.pb-guide{margin-left:auto;font-size:10.5px;font-weight:700;color:#97A0B4;white-space:nowrap}

/* ── 사이드 / 팁 카드 ── */
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;padding-right:2px}
.sec-title{font-size:12px;font-weight:900;margin:0 0 8px;display:flex;align-items:center;gap:7px;color:var(--navy)}
.dot-sq{width:7px;height:7px;border-radius:2px;background:var(--navy2)}
.dot-sq.orange{background:var(--orange)}

.tip-tabs{display:flex;gap:3px;background:#EFE7D8;border-radius:11px;padding:3px}
.tip-tabs button{
  flex:1;border:0;background:transparent;color:#5A6780;font-size:12px;font-weight:900;
  padding:7px 2px;border-radius:9px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.tip-tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(22,36,75,.16)}

.tip-body{margin-top:10px}
.tip-name{font-size:13.5px;font-weight:900;margin:0 0 2px;color:var(--navy)}
.tip-sub{font-size:10.5px;color:#958C7C;margin:0 0 8px;font-weight:700}
.tip-row{display:flex;gap:7px;align-items:flex-start;margin-top:7px;font-size:11.5px;line-height:1.55;color:#3C4A63;font-weight:600}
.tip-row b{color:var(--navy)}
.tip-badge{flex:0 0 auto;font-size:9.5px;font-weight:900;padding:2px 6px;border-radius:6px;margin-top:1px}
.tip-badge.def{background:var(--navy2);color:#fff}
.tip-badge.off{background:#FDEDE4;color:var(--orange-d)}
.btn-set{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:11px;
  height:36px;border-radius:10px;border:1px solid #E3D9C6;background:#FBF7EE;
  color:var(--navy);font-size:11.5px;font-weight:900;cursor:pointer;transition:.15s;
}
.btn-set:hover{background:#F5EDDC;border-color:#DCCFB6}
.btn-set .ico{width:13px;height:13px}
.legend-line{font-size:10px;color:#8B93A6;line-height:1.6;margin:11px 0 0;padding-top:9px;border-top:1px solid #F1EADA;font-weight:700}
.legend-line .lb{display:inline-grid;place-items:center;font-size:8.5px;font-weight:900;border-radius:50%;width:16px;height:16px;vertical-align:-4px}
.legend-line .lb.def{background:var(--navy2);color:#fff}
.legend-line .lb.off{background:#FFF8EE;border:1.5px solid var(--orange);color:var(--orange-d)}
.legend-line .lb.ball{background:var(--orange);border:1.5px solid #7A3410;width:14px;height:14px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:11px;border:1px solid #E3D9C6;background:#fff;color:var(--navy);
  font-size:12px;font-weight:900;padding:10px 11px;cursor:pointer;transition:.15s;
}
.btn:hover{background:#FBF7EE}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 3px 11px rgba(232,104,43,.28)}
.btn.primary:hover{background:#DC5D22}
.btn.ghost{background:transparent;border-color:#EBE3D3;color:#8B8272;font-weight:800}

/* ── 토스트 / 모달 ── */
.toast{
  position:fixed;left:50%;bottom:20px;transform:translate(-50%,18px);
  background:var(--navy);color:#fff;padding:10px 13px;border-radius:12px;
  font-size:12px;font-weight:700;display:flex;align-items:center;gap:10px;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  box-shadow:0 12px 28px rgba(22,36,75,.32);z-index:60;max-width:calc(100vw - 28px);
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:var(--orange);color:#fff;font-size:11.5px;font-weight:900;padding:6px 10px;border-radius:8px;cursor:pointer;flex:0 0 auto}

.modal{position:fixed;inset:0;background:rgba(16,26,50,.52);display:grid;place-items:center;padding:16px;z-index:70;backdrop-filter:blur(3px)}
.modal[hidden]{display:none}
.modal-box{background:#fff;border-radius:18px;padding:18px;width:min(520px,100%);box-shadow:0 26px 64px rgba(16,26,50,.4);max-height:92dvh;overflow:auto}
.modal-box h3{margin:0 0 6px;font-size:16px;font-weight:900}
.m-desc{font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 12px}
.m-desc b{color:var(--orange-d)}
#mLink{
  width:100%;border:1px solid #E3D9C6;border-radius:10px;padding:10px;font-size:11px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--navy);background:#FBF7EE;
  resize:none;line-height:1.5;word-break:break-all;
}
.m-meta{font-size:10.5px;color:#A39A8B;margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.m-btns{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.m-btns .btn{flex:1;min-width:88px}

/* ── 반응형 ── */
@media (max-width:1080px){
  .layout{grid-template-columns:minmax(0,1fr) 312px}
}

@media (max-width:920px){
  .layout{display:block;padding:10px;max-width:none}
  .stage{min-height:0}
  .board{flex:none}
  .court-holder{flex:none;margin:2px 8px 6px;border-radius:12px}
  #board{position:static;inset:auto;width:100%;height:auto}
  .side{margin-top:10px;overflow:visible;padding-right:0}
  .team-chip{display:none}
  .toolbar{gap:4px;padding:6px 7px}
  .tools{gap:2px}
  .tools-end{padding-left:4px}
  .tool{padding:6px 6px;font-size:11px;gap:4px}
  .tool .ico{width:14px;height:14px}
  .seg{padding:2px}
  .seg button{padding:5px 8px;font-size:10.5px}
  .hintline{font-size:10.5px;padding:6px 10px 0}
  .pagebar{padding:9px 9px 10px}
  .pb-label{display:none}
  .ptab{min-width:40px;height:40px}
  .btn-add{height:40px;font-size:12px;padding:0 10px}
  .pb-foot{gap:6px;margin-top:8px}
  .btn-play{flex:1;height:46px;font-size:14px}
  .btn-del{height:46px;font-size:11.5px;padding:0 10px}
  .pb-guide{order:3;width:100%;margin:2px 0 0;font-size:10px;text-align:center;white-space:normal}
  .tip-row{font-size:11.5px}
}

@media (max-width:420px){
  .topbar{padding:9px 11px;gap:8px}
  .logo{width:31px;height:31px}
  .brand-txt h1{font-size:17px}
  .brand-txt p{font-size:7.5px;letter-spacing:.16em}
  .btn-share{padding:8px 11px;font-size:11.5px;border-radius:10px}
  .layout{padding:8px}
  .pad{padding:12px 12px 13px}
  .tool span{font-size:10.5px}
  .seg button{padding:5px 7px;font-size:10px}
}

@media (min-width:921px){
  body{overflow:hidden}
  .toast{left:auto;right:24px;bottom:22px;transform:translate(0,18px)}
  .toast.show{transform:translate(0,0)}
  .app{height:100dvh}
  .board{min-height:0}
  .side{max-height:100%}
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#E8682B"/><path d="M3 16h26M16 3v26" stroke="#16244B" stroke-width="1.7"/><path d="M7.5 8.5c6 5 6 10 0 15M24.5 8.5c-6 5-6 10 0 15" stroke="#16244B" stroke-width="1.7" fill="none"/></svg>
      </span>
      <div class="brand-txt">
        <h1>도약 전술판</h1>
        <p>DOYAK TACTICS BOARD</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="team-chip">DIVISION 6</span>
      <button class="btn-share" id="btnShare" type="button">
        <svg class="ico" aria-hidden="true"><use href="#i-link"/></svg><span>공유 링크</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="board card">
        <div class="toolbar">
          <div class="tools" id="toolGroup" role="group" aria-label="그리기 도구">
            <button class="tool" type="button" data-tool="drag" aria-pressed="true"><svg class="ico" aria-hidden="true"><use href="#i-move"/></svg><span>드래그</span></button>
            <button class="tool" type="button" data-tool="arrow" aria-pressed="false"><svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg><span>화살표</span></button>
          </div>
          <div class="tools tools-end" id="toolActions">
            <button class="tool" type="button" id="btnErase"><svg class="ico" aria-hidden="true"><use href="#i-eraser"/></svg><span>지우기</span></button>
            <button class="tool" type="button" id="btnReset"><svg class="ico" aria-hidden="true"><use href="#i-reset"/></svg><span>초기화</span></button>
          </div>
          <div class="seg" id="courtSeg" role="group" aria-label="코트 종류">
            <button type="button" data-mode="half" class="on">하프</button>
            <button type="button" data-mode="full">풀</button>
          </div>
        </div>

        <div class="hintline" id="hint">선수를 끌어 움직이세요 · 다 움직였으면 <b>＋ 다음 페이지</b></div>

        <div class="court-holder">
          <svg id="board" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 47" preserveAspectRatio="xMidYMid meet" role="img" aria-label="농구 전술판">
            <g id="courtLayer"></g>
            <g id="linesLayer"></g>
            <g id="playersLayer"></g>
            <g id="tempLayer"></g>
          </svg>
        </div>

        <div class="pagebar">
          <div class="pb-head">
            <span class="pb-label">페이지</span>
            <div class="ptabs" id="pageTabs" role="tablist" aria-label="페이지 목록"></div>
            <button class="btn-add" type="button" id="btnAddPage"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg>다음 페이지</button>
          </div>

      parts.push('<text class="wmark" x="25" y="24.2">DOYAK</text>');
      parts.push('<text class="clabel" x="25" y="25.6">하이포스트</text>');
      parts.push('<text class="clabel" x="11.5" y="45.6">숏코너</text>');
      parts.push('<text class="clabel" x="38.5" y="45.6">숏코너</text>');
    } else {
      parts.push('<g transform="matrix(0,1,1,0,0,0)">' + END_MARKUP + '</g>');
      parts.push('<g transform="matrix(0,1,-1,0,94,0)">' + END_MARKUP + '</g>');
      parts.push('<path class="ln" d="M47,0 V50"/>');
      parts.push('<circle class="ln" cx="47" cy="25" r="6"/>');
      parts.push('<rect class="boundary" x="0" y="0" width="94" height="50" rx="0.4"/>');
      parts.push('<text class="wmark" x="23.5" y="25.4">DOYAK</text>');
      parts.push('<text class="wmark" x="70.5" y="25.4">DOYAK</text>');
    }
    $('#courtLayer').innerHTML = parts.join('');
  }

  /* ──────────────────────────── 토큰 ──────────────────────────── */
  function buildTokens() {
    const layer = $('#playersLayer');
    let html = '';
    IDS.forEach(function (id) {
      const def = !!DEF[id];
      html += '<g class="tok ' + (def ? 'def' : 'off') + '" data-id="' + id + '" transform="translate(0 0)">'
        + '<circle class="hit" r="3.2"/>'
        + '<circle class="disc" r="2.05"/>'
        + '<text class="lbl" x="0" y="0">' + id + '</text>'
        + '</g>';
    });
    html += '<g class="tok ball" data-id="ball" transform="translate(0 0)">'
      + '<circle class="hit" r="2.5"/>'
      + '<circle r="0.92" fill="#E8682B" stroke="#7A3410" stroke-width="0.13"/>'
      + '<path d="M-0.92,0 H0.92 M0,-0.92 V0.92" stroke="#7A3410" stroke-width="0.085" fill="none"/>'
      + '<path d="M-0.62,-0.66 Q0.06,0 -0.62,0.66 M0.62,-0.66 Q-0.06,0 0.62,0.66" stroke="#7A3410" stroke-width="0.085" fill="none"/>'
      + '</g>';
    layer.innerHTML = html;
    tokEls = {};
    IDS.forEach(function (id) { tokEls[id] = layer.querySelector('[data-id="' + id + '"]'); });
    tokEls.ball = layer.querySelector('[data-id="ball"]');
  }

  function tokScale() {
    const c = COURT[state.mode];
    const px = (board && board.getBoundingClientRect().width) || 600;
    const pxPerFt = px / c.w;
    const want = 22 / pxPerFt / 4.1;
    return clamp(Math.round(want * 20) / 20, 1, 1.7);
  }

  function place(id) {
    const el = tokEls[id];
    if (!el) return;
    const p = id === 'ball' ? view.b : view.p[id];
    if (!p) return;
    const s = tokScale();
    el.setAttribute('transform', 'translate(' + f2(p[0]) + ' ' + f2(p[1]) + ')' + (s !== 1 ? ' scale(' + s + ')' : ''));
  }
  function placeAll() { IDS.forEach(place); place('ball'); }

  function loadView(page) {
    const pg = page || cur();
    IDS.forEach(function (id) { view.p[id] = [pg.p[id][0], pg.p[id][1]]; });
    view.b = [pg.b[0], pg.b[1]];
    placeAll();
  }

  /* ──────────────────────────── 선(화살표) ──────────────────────────── */
  function lineMarkup(l) {
    const a = l.pts[0], b = l.pts[1];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len < 0.7) return '';
    const ux = dx / len, uy = dy / len, px = -uy, py = ux;
    const ex = b[0] - ux * 1.5, ey = b[1] - uy * 1.5;
    return '<line x1="' + f2(a[0]) + '" y1="' + f2(a[1]) + '" x2="' + f2(ex) + '" y2="' + f2(ey) + '" stroke="#E8682B" stroke-width="0.55" stroke-linecap="round"/>'
      + '<path d="M' + f2(b[0]) + ',' + f2(b[1]) + ' L' + f2(ex + px * 0.85) + ',' + f2(ey + py * 0.85) + ' L' + f2(ex - px * 0.85) + ',' + f2(ey - py * 0.85) + ' Z" fill="#E8682B"/>';
  }

  function renderLines() {
    $('#linesLayer').innerHTML = cur().l.map(lineMarkup).join('');
  }

  /* ──────────────────────────── 페이지 ──────────────────────────── */
  function snapshotAll() {
    return { i: state.i, mode: state.mode, pages: state.pages.map(function (pg) { return mkPage(pg); }) };
  }
  function restoreAll(snap) {
    state.mode = snap.mode;
    state.pages = snap.pages.map(function (pg) { return mkPage(pg); });
    state.i = clamp(snap.i, 0, state.pages.length - 1);
    buildCourt(); loadView(); renderLines(); syncAll(); scheduleSync();
  }
  function pushUndo() {
    undo.push(snapshotAll());
    if (undo.length > 40) undo.shift();
  }
  function doUndo() {
    const snap = undo.pop();
    if (!snap) { toast('되돌릴 작업이 없어요'); return; }
    restoreAll(snap);
    toast('한 단계 되돌렸어요');
  }

  function goPage(k, animate) {
    if (k < 0 || k >= state.pages.length) return;
    stopPlay();
    const changed = k !== state.i;
    state.i = k;
    syncPages();
    if (animate && changed) {
      animateTo(cur(), 380, function () { renderLines(); });
    } else {
      loadView(); renderLines();
    }
    scheduleSync();
  }

  function addPage() {
    if (state.pages.length >= MAXP) { toast('페이지는 ' + MAXP + '개까지 만들 수 있어요'); return; }
    pushUndo();
    stopPlay();
    const pg = mkPage({ p: cur().p, b: cur().b, l: [] });  /* 위치만 복사 · 선은 새로 */
    state.pages.splice(state.i + 1, 0, pg);
    state.i += 1;
    loadView(); renderLines(); syncAll(); scheduleSync();
    toast('새 페이지 — 이어서 움직이세요');
  }

  function delPage() {
    if (state.pages.length < 2) { toast('페이지가 하나뿐이에요 · 초기화를 쓰세요'); return; }
    pushUndo();
    stopPlay();
    const n = state.i;
    state.pages.splice(n, 1);
    state.i = clamp(n, 0, state.pages.length - 1);
    loadView(); renderLines(); syncAll(); scheduleSync();
    toast((n + 1) + '페이지 삭제', { label: '되돌리기', fn: doUndo });
  }

  function setFormation(key) {
    const f = FORMS[key];
    if (!f) return;
    pushUndo();
    stopPlay();
    const pg = cur();
    IDS.forEach(function (id) { pg.p[id] = [f.p[id][0], f.p[id][1]]; });
    pg.b = [f.b[0], f.b[1]];
    pg.l = [];
    loadView(); renderLines(); syncAll(); scheduleSync();
    toast(f.name + ' 대형으로 세팅했어요', { label: '되돌리기', fn: doUndo });
  }

  /* ──────────────────────────── 애니메이션 / 재생 ──────────────────────────── */
  function animateTo(page, dur, done) {
    cancelAnimationFrame(animId);
    const from = {}, fb = [view.b[0], view.b[1]];
    IDS.forEach(function (id) { from[id] = [view.p[id][0], view.p[id][1]]; });
    const t0 = performance.now();
    function tick(now) {
      const k = Math.min(1, (now - t0) / dur);
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      IDS.forEach(function (id) {
        const a = from[id], b = page.p[id];
        view.p[id] = [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e];
        place(id);
      });
      view.b = [fb[0] + (page.b[0] - fb[0]) * e, fb[1] + (page.b[1] - fb[1]) * e];
      place('ball');
      if (k < 1) animId = requestAnimationFrame(tick);
      else { loadView(page); if (done) done(); }
    }
    animId = requestAnimationFrame(tick);
  }

  const HOLD = 1100, MOVE = 760;

  function togglePlay() { state.playing ? stopPlay() : startPlay(); }

  function startPlay() {
    if (state.pages.length < 2) { toast('＋ 다음 페이지로 한 장 더 만들면 이어서 재생돼요'); return; }
    cancelAnimationFrame(animId);
    state.playing = true;
    state.i = 0;
    syncPages(); loadView(); renderLines(); syncPlay();
    playTimer = setTimeout(function () { stepTo(1); }, HOLD);
  }

  function stepTo(k) {
    if (!state.playing) return;
    if (k >= state.pages.length) { stopPlay(); return; }
    state.i = k;
    syncPages();
    animateTo(state.pages[k], MOVE, function () {
      if (!state.playing) return;
      renderLines();
      playTimer = setTimeout(function () { stepTo(k + 1); }, HOLD);
    });
  }

  function stopPlay() {
    if (playTimer) { clearTimeout(playTimer); playTimer = 0; }
    cancelAnimationFrame(animId);
    if (state.playing) {
      state.playing = false;
      loadView(); renderLines();
    }
    syncPlay();
  }

  /* ──────────────────────────── UI 동기화 ──────────────────────────── */
  function syncAll() { syncMode(); syncTools(); syncPages(); syncPlay(); }

  function syncMode() {
    $$('#courtSeg button').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === state.mode); });
  }

  function syncTools() {
    $$('#toolGroup .tool').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.tool === state.tool));
    });
    document.body.classList.toggle('drawing', state.tool !== 'drag');
    $('#hint').innerHTML = state.tool === 'drag'
      ? '선수를 끌어 움직이세요 · 다 움직였으면 <b>＋ 다음 페이지</b>'
      : '코트를 끌어 화살표를 그리세요 · 선수를 움직이려면 <b>드래그</b>';
  }

  function syncPages() {
    const box = $('#pageTabs');
    box.innerHTML = state.pages.map(function (pg, k) {
      return '<button class="ptab' + (k === state.i ? ' on' : '') + '" type="button" role="tab"'
        + ' aria-selected="' + (k === state.i ? 'true' : 'false') + '"'
        + ' data-page="' + k + '" aria-label="' + (k + 1) + '페이지">' + (k + 1) + '</button>';
    }).join('');
    const on = box.querySelector('.ptab.on');
    if (on) {
      const l = on.offsetLeft, w = on.offsetWidth, sl = box.scrollLeft, bw = box.clientWidth;
      if (l < sl) box.scrollLeft = l - 6;
      else if (l + w > sl + bw) box.scrollLeft = l + w - bw + 6;
    }
    $('#btnDelPage').disabled = state.pages.length < 2;
  }

  function syncPlay() {
    const b = $('#btnPlay');
    b.classList.toggle('playing', state.playing);
    b.innerHTML = '<svg class="ico" aria-hidden="true"><use href="#' + (state.playing ? 'i-pause' : 'i-play') + '"/></svg>'
      + '<span>' + (state.playing ? '재생 중지' : '전체 재생') + '</span>';
    b.setAttribute('aria-label', state.playing ? '재생 중지' : '전체 재생');
  }

  function renderTip() {
    $$('#tipTabs button').forEach(function (b) { b.classList.toggle('on', +b.dataset.tip === state.tip); });
    const t = TIPS[state.tip];
    const rows = t.rows.map(function (r) {
      return '<div class="tip-row"><span class="tip-badge ' + r[0] + '">' + r[1] + '</span><span>' + r[2] + '</span></div>';
    }).join('');
    $('#tipBody').innerHTML = '<p class="tip-name">' + esc(t.name) + '</p>'
      + '<p class="tip-sub">' + esc(t.sub) + '</p>' + rows
      + '<button class="btn-set" type="button" data-form="' + t.form + '">'
      + '<svg class="ico" aria-hidden="true"><use href="#i-reset"/></svg>이 대형으로 코트 세팅</button>';
  }

  /* ──────────────────────────── 코트 종류 ──────────────────────────── */
  const halfToFull = (x, y) => [47 - y, x];
  const fullToHalf = (x, y) => [y, 47 - (x > 47 ? 94 - x : x)];

  function setMode(mode) {
    if (!COURT[mode] || mode === state.mode) { syncMode(); return; }
    pushUndo();
    stopPlay();
    const fwd = state.mode === 'half';
    const conv = p => (fwd ? halfToFull(p[0], p[1]) : fullToHalf(p[0], p[1]));
    state.pages.forEach(function (pg) {
      IDS.forEach(function (id) { pg.p[id] = conv(pg.p[id]); });
      pg.b = conv(pg.b);
      pg.l = pg.l.map(function (l) { return { pts: [conv(l.pts[0]), conv(l.pts[1])] }; });
    });
    state.mode = mode;
    buildCourt(); loadView(); renderLines(); syncAll(); scheduleSync();
  }

  /* ──────────────────────────── 링크 공유 / 저장 ──────────────────────────── */
  function snapshot() {
    return {
      v: 2,
      m: state.mode === 'full' ? 1 : 0,
      i: state.i,
      pages: state.pages.map(function (pg) {
        const a = [];
        IDS.forEach(function (id) { a.push(R(pg.p[id][0]), R(pg.p[id][1])); });
        return {
          p: a,
          b: [R(pg.b[0]), R(pg.b[1])],
          l: pg.l.map(function (l) { return [R(l.pts[0][0]), R(l.pts[0][1]), R(l.pts[1][0]), R(l.pts[1][1])]; })
        };
      })
    };
  }

  function encode() {
    try { return LZString.compressToEncodedURIComponent(JSON.stringify(snapshot())); }
    catch (e) { return ''; }
  }

  function buildUrl() { return location.href.split('#')[0] + '#t=' + encode(); }

  function applyObj(o) {
    if (!o) return false;
    let pages = null, mode = 'half', idx = 0;

    if (o.v === 2 && Array.isArray(o.pages) && o.pages.length) {
      pages = o.pages.slice(0, MAXP).map(function (pg) {
        const p = {}, a = pg.p || [];
        IDS.forEach(function (id, k) { p[id] = [(a[k * 2] || 0) / 10, (a[k * 2 + 1] || 0) / 10]; });
        const b = [(pg.b && pg.b[0] || 0) / 10, (pg.b && pg.b[1] || 0) / 10];
        const l = (pg.l || []).map(function (q) { return { pts: [[q[0] / 10, q[1] / 10], [q[2] / 10, q[3] / 10]] }; });
        return { p: p, b: b, l: l };
      });
      mode = o.m === 1 ? 'full' : 'half';
      idx = o.i | 0;
    } else if (o.v === 1 && Array.isArray(o.p)) {
      /* 예전(v1) 공유 링크도 열리도록 변환 */
      const unP = function (arr) {
        const p = {};
        IDS.forEach(function (id, k) { p[id] = [(arr[k * 2] || 0) / 10, (arr[k * 2 + 1] || 0) / 10]; });
        return { p: p, b: [(arr[20] || 0) / 10, (arr[21] || 0) / 10] };
      };
      const unL = function (arr) {
        return (arr || []).map(function (a) {
          const pts = [];
          for (let k = 1; k + 1 < a.length; k += 2) pts.push([a[k] / 10, a[k + 1] / 10]);
          if (pts.length < 2) return null;
          return { pts: [pts[0], pts[pts.length - 1]] };
        }).filter(Boolean);
      };
      pages = (o.s && o.s.length ? o.s : [{ p: o.p, l: o.l }]).map(function (s) {
        const q = unP(s.p || []);
        return { p: q.p, b: q.b, l: unL(s.l) };
      });
      mode = o.m === 1 ? 'full' : 'half';
      idx = pages.length - 1;
    }
    if (!pages || !pages.length) return false;

    const c = COURT[mode];
    pages.forEach(function (pg) {
      IDS.forEach(function (id) { pg.p[id] = clampPt(pg.p[id][0], pg.p[id][1], 1.8).map(function (v, j) { return clamp(v, 1.8, (j ? c.h : c.w) - 1.8); }); });
      pg.b = [clamp(pg.b[0], 1.8, c.w - 1.8), clamp(pg.b[1], 1.8, c.h - 1.8)];
      pg.l = pg.l.filter(function (l) { return l.pts && l.pts.length === 2; });
    });

    state.mode = mode;
    state.pages = pages;
    state.i = clamp(idx, 0, pages.length - 1);
    return true;
  }

  function scheduleSync() {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () {
      const enc = encode();
      if (enc) {
        try { history.replaceState(null, '', location.pathname + location.search + '#t=' + enc); } catch (e) { }
      }
      try { localStorage.setItem(STORE, JSON.stringify(snapshot())); } catch (e) { }
    }, 600);
  }

  function openShare() {
    const url = buildUrl();
    $('#mLink').value = url;
    $('#mMeta').innerHTML = '<span>' + state.pages.length + '페이지 · ' + url.length.toLocaleString('ko-KR') + '자</span><span>링크만 있으면 어디서든 열립니다</span>';
    $('#mCopy').textContent = '복사';
    $('#modal').hidden = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { $('#mCopy').textContent = '복사됨'; }, function () { });
    }
    $('#mLink').focus();
    try { $('#mLink').select(); } catch (e) { }
  }

  function copyLink() {
    const el = $('#mLink');
    el.focus(); el.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (!ok && navigator.clipboard) {
      navigator.clipboard.writeText(el.value).then(function () { $('#mCopy').textContent = '복사됨'; toast('작전 링크를 복사했어요'); }, function () { toast('길게 눌러 직접 복사해 주세요'); });
      return;
    }
    if (ok) { $('#mCopy').textContent = '복사됨'; toast('작전 링크를 복사했어요'); }
    else toast('길게 눌러 직접 복사해 주세요');
  }

  function nativeShare() {
    const url = $('#mLink').value;
    if (navigator.share) {
      navigator.share({ title: '도약 전술판', text: '도약 농구팀 작전판 — 링크를 열면 페이지가 그대로 열립니다.', url: url })
        .catch(function () { });
    } else {
      copyLink();
    }
  }

  /* ──────────────────────────── 토스트 ──────────────────────────── */
  function toast(msg, action) {
    const el = $('#toast');
    el.innerHTML = '<span>' + esc(msg) + '</span>';
    if (action) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = action.label;
      b.addEventListener('click', function () { hideToast(); action.fn(); });
      el.appendChild(b);
    }
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, action ? 4500 : 2000);
  }
  function hideToast() { $('#toast').classList.remove('show'); }

  /* ──────────────────────────── 입력 ──────────────────────────── */
  function onDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const pt = toCourt(e);
    const tokEl = e.target.closest ? e.target.closest('.tok') : null;

    if (state.tool === 'drag') {
      if (!tokEl) return;
      if (state.playing) stopPlay();
      const id = tokEl.dataset.id;
      const p = id === 'ball' ? view.b : view.p[id];
      drag = { id: id, dx: p[0] - pt.x, dy: p[1] - pt.y, el: tokEl, moved: false };
      try { board.setPointerCapture(e.pointerId); } catch (err) { }
      tokEl.classList.add('dragging');
      document.body.classList.add('dragging');
      e.preventDefault();
      return;
    }

    if (state.playing) stopPlay();
    const c = COURT[state.mode];
    if (pt.x < -1.2 || pt.y < -1.2 || pt.x > c.w + 1.2 || pt.y > c.h + 1.2) return;
    stroke = { a: [clamp(pt.x, 0, c.w), clamp(pt.y, 0, c.h)], b: null };
    try { board.setPointerCapture(e.pointerId); } catch (err) { }
    e.preventDefault();
  }

  function onMove(e) {
    if (!drag && !stroke) return;
    const pt = toCourt(e);
    const c = COURT[state.mode];
    if (drag) {
      const p = clampPt(pt.x + drag.dx, pt.y + drag.dy, 2.2);
      if (drag.id === 'ball') {
        view.b = p; cur().b = [p[0], p[1]];
      } else {
        view.p[drag.id] = p; cur().p[drag.id] = [p[0], p[1]];
      }
      place(drag.id);
      drag.moved = true;
      return;
    }
    stroke.b = [clamp(pt.x, 0, c.w), clamp(pt.y, 0, c.h)];
    $('#tempLayer').innerHTML = lineMarkup({ pts: [stroke.a, stroke.b] });
  }

  function onUp() {
    if (drag) {
      drag.el.classList.remove('dragging');
      document.body.classList.remove('dragging');
      const moved = drag.moved;
      drag = null;
      if (moved) scheduleSync();
      return;
    }
    if (stroke) {
      const a = stroke.a;
      const b = stroke.b ? trimToToken(stroke.a, stroke.b) : null;
      stroke = null;
      $('#tempLayer').innerHTML = '';
      if (!b) return;
      if (Math.sqrt(Math.pow(b[0] - a[0], 2) + Math.pow(b[1] - a[1], 2)) < 1.0) return;
      pushUndo();
      cur().l.push({ pts: [a, b] });
      renderLines();
      scheduleSync();
    }
  }

  /* 화살표 머리가 선수 원에 가려지지 않게 끝점을 조금 당긴다 */
  function trimToToken(a, b) {
    const pts = IDS.map(function (id) { return { p: cur().p[id], g: 2.55 }; })
      .concat([{ p: cur().b, g: 1.15 }]);
    let bestDb = Infinity, gap = 2.55, dBest = Infinity;
    pts.forEach(function (t) {
      const db = Math.sqrt(Math.pow(t.p[0] - b[0], 2) + Math.pow(t.p[1] - b[1], 2));
      if (db > t.g + 0.6) return;
      if (db < bestDb) {
        bestDb = db;
        gap = t.g;
        dBest = Math.sqrt(Math.pow(t.p[0] - a[0], 2) + Math.pow(t.p[1] - a[1], 2));
      }
    });
    if (!isFinite(bestDb)) return b;
    const L = Math.sqrt(Math.pow(b[0] - a[0], 2) + Math.pow(b[1] - a[1], 2));
    const nl = dBest - gap;
    if (nl < 1.2 || nl > L) return b;
    const k = nl / L;
    return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  }

  /* ──────────────────────────── 이벤트 연결 ──────────────────────────── */
  function bind() {
    $('#toolGroup').addEventListener('click', function (e) {
      const b = e.target.closest('.tool');
      if (!b) return;
      state.tool = b.dataset.tool;
      syncTools();
    });

    $('#btnErase').addEventListener('click', function () {
      if (!cur().l.length) { toast('지울 화살표가 없어요'); return; }
      pushUndo();
      cur().l = [];
      renderLines(); scheduleSync();
      toast('이 페이지의 화살표를 지웠어요', { label: '되돌리기', fn: doUndo });
    });

    $('#btnReset').addEventListener('click', function () {
      pushUndo();
      stopPlay();
      const pg = cur(), f = FORMS.zone23;
      IDS.forEach(function (id) { pg.p[id] = [f.p[id][0], f.p[id][1]]; });
      pg.b = [f.b[0], f.b[1]];
      pg.l = [];
      loadView(); renderLines(); scheduleSync();
      toast('이 페이지를 2-3 기본 대형으로 되돌렸어요', { label: '되돌리기', fn: doUndo });
    });

    $('#courtSeg').addEventListener('click', function (e) {
      const b = e.target.closest('button[data-mode]');
      if (b) setMode(b.dataset.mode);
    });

    $('#btnAddPage').addEventListener('click', addPage);
    $('#btnDelPage').addEventListener('click', delPage);
    $('#btnPlay').addEventListener('click', togglePlay);

    $('#pageTabs').addEventListener('click', function (e) {
      const b = e.target.closest('[data-page]');
      if (b) goPage(+b.dataset.page, true);
    });

    $('#tipTabs').addEventListener('click', function (e) {
      const b = e.target.closest('[data-tip]');
      if (!b) return;
      state.tip = +b.dataset.tip;
      renderTip();
    });
    $('#tipBody').addEventListener('click', function (e) {
      const b = e.target.closest('[data-form]');
      if (b) setFormation(b.dataset.form);
    });

    $('#btnShare').addEventListener('click', openShare);
    $('#mCopy').addEventListener('click', copyLink);
    $('#mShare').addEventListener('click', nativeShare);
    $('#mClose').addEventListener('click', function () { $('#modal').hidden = true; });
    $('#modal').addEventListener('click', function (e) { if (e.target === $('#modal')) $('#modal').hidden = true; });

    let rs = 0;
    window.addEventListener('resize', function () {
      clearTimeout(rs);
      rs = setTimeout(placeAll, 160);
    });

    board.addEventListener('pointerdown', onDown);
    board.addEventListener('pointermove', onMove);
    board.addEventListener('pointerup', onUp);
    board.addEventListener('pointercancel', onUp);

    document.addEventListener('keydown', function (e) {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); doUndo(); return; }
      if (e.key === 'Escape') { $('#modal').hidden = true; stopPlay(); return; }
      if (e.key === 'ArrowRight') { e.preventDefault(); goPage(state.i + 1, true); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); goPage(state.i - 1, true); }
    });
  }

  /* ──────────────────────────── 시작 ──────────────────────────── */
  function boot() {
    board = $('#board');
    state.pages = [mkPage(FORMS.zone23)];
    state.i = 0;

    let restored = false, shared = false;
    const h = location.hash || '';
    if (h.indexOf('#t=') === 0) {
      try {
        const json = LZString.decompressFromEncodedURIComponent(h.slice(3));
        if (json && applyObj(JSON.parse(json))) { restored = true; shared = true; }
      } catch (e) { restored = false; }
    }
    if (!restored) {
      try {
        const raw = localStorage.getItem(STORE);
        if (raw && applyObj(JSON.parse(raw))) restored = true;
      } catch (e) { }
    }

    buildTokens();
    buildCourt();
    loadView();
    renderLines();
    bind();
    syncAll();
    renderTip();
    scheduleSync();

    if (shared) setTimeout(function () { toast('공유된 작전을 열었어요 · ▶ 전체 재생'); }, 350);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
