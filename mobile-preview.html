<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모바일 390px 화면 확인용</title>
<style>
  body { margin: 0; background: #0f172a; font-family: sans-serif; }
  .wrap { padding: 16px; }
  .label { color: #cbd5e1; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .phone { width: 390px; height: 844px; border: 0; background: #fff; border-radius: 12px; overflow: hidden; }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">모바일 390px 미리보기 (아이폰 기준 폭)</div>
  <iframe class="phone" src="./index.html"></iframe>
</div>
<script>
  // 확인용: ?y=스크롤위치 로 앱 화면의 스크롤 위치를 지정한다.
  var f = document.querySelector('iframe');
  var y = Number(new URLSearchParams(location.search).get('y') || 0);
  f.addEventListener('load', function () {
    try { f.contentWindow.scrollTo(0, y); } catch (e) {}
  });
</script>
</body>
</html>
