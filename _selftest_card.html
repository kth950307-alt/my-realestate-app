<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>카드 자체 테스트</title>
<style>
  body{font-family:"Malgun Gothic",sans-serif;background:#eef2f7;margin:0;padding:20px;}
  h2{font-size:15px;margin:22px 0 6px;}
  canvas{width:420px;height:420px;border:1px solid #cbd5e1;background:#fff;margin-right:12px;vertical-align:top;}
  pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:10px;font-size:12px;white-space:pre-wrap;max-width:560px;}
  .row{display:flex;flex-wrap:wrap;gap:12px;}
  iframe{position:absolute;left:-9999px;width:900px;height:600px;}
</style>
</head>
<body>
<h2>1) 월세 · base64 사진</h2>
<div class="row"><div id="c1"></div><pre id="t1"></pre></div>
<h2>2) 매매 · 외부 URL 사진(crossOrigin)</h2>
<div class="row"><div id="c2"></div></div>
<h2>3) 매매 · 사진 없음(대체 화면)</h2>
<div class="row"><div id="c3"></div></div>
<iframe id="frame" src="./index.html"></iframe>
<script>
function sampleImage() {
  const c = document.createElement('canvas');
  c.width = 900; c.height = 600;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 900, 600);
  g.addColorStop(0, '#93c5fd'); g.addColorStop(1, '#1e40af');
  x.fillStyle = g; x.fillRect(0, 0, 900, 600);
  x.fillStyle = '#ffffff'; x.font = '900 64px sans-serif';
  x.fillText('공장 사진', 80, 330);
  return c.toDataURL('image/png');
}

const base = {
  id: 'W-261123-1643', deal: '임대', region: '석남동', zone: '일반공업지역',
  title: '석남동 1층 60평 공장 (실측 3.6m · 정남향)', price: '보증금 1,800만 / 월 180만',
  areaNum: 60, landInfo: '전용 60평', height: '3.6m', powerNum: 10, powerText: '10kW',
  hasHoist: 'NO', hoist: '없음', hasTrailer: 'YES', road: '대로변 (40ft 츄레라 진입가능)',
  roadRaw: '대로변 (40ft 츄레라 진입가능)',
  desc: '• 대로변 정남향, 내부 화장실·사무실 있음\n• 입주시기: 즉시 / 추천업종: 제조·물류',
  imgs: [sampleImage()]
};

const sale1 = Object.assign({}, base, {
  id: 'W-261118-0930', deal: '매매', region: '원창동', title: '원창동 1층 250평 공장',
  price: '매매 32억', areaNum: 250, landInfo: '전용 250평', height: '5.2m',
  powerText: '100kW', powerNum: 100, hasHoist: 'YES', hoist: '호이스트 5T',
  road: '광폭도로 12m', roadRaw: '광폭도로 12m',
  imgs: ['https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=900&q=80']
});

const sale2 = Object.assign({}, sale1, { id: 'W-261117-1616', imgs: [] });

const frame = document.getElementById('frame');
frame.addEventListener('load', () => {
  const w = frame.contentWindow;
  const show = (id, cv) => {
    cv.style.width = '420px'; cv.style.height = '420px';
    document.getElementById(id).appendChild(cv);
  };
  Promise.resolve().then(() => w.buildKakaoCardCanvas(base)).then(cv => show('c1', cv));
  Promise.resolve().then(() => w.buildKakaoCardCanvas(sale1)).then(cv => show('c2', cv));
  Promise.resolve().then(() => w.buildKakaoCardCanvas(sale2)).then(cv => show('c3', cv));
  document.getElementById('t1').textContent = w.buildKakaoSummary(base);
});
</script>
</body>
</html>
