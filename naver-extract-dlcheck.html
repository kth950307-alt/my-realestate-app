<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>download check</title></head>
<body style="font:16px sans-serif;padding:30px">
<h1>CSV 저장 확인용 (임시)</h1>
<button id="go" style="font-size:20px;padding:14px 22px">파일 저장 실행</button>
<pre id="out" style="margin-top:20px"></pre>
<script>
var Q = String.fromCharCode(34);
  function cell(v) {
    v = v == null ? '' : String(v);
    if (v.indexOf(',') >= 0 || v.indexOf('\n') >= 0 || v.indexOf(Q) >= 0) {
      return Q + v.split(Q).join(Q + Q) + Q;
    }
    return v;
  }
  function stamp() {
    var d = new Date();
    function p(n) { return (n > 9 ? '' : '0') + n; }
    return '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
  }
  function save(list) {
    var head = ['매물번호', '거래구분', '가격', '동', '매물명', '용도', '사용승인(연차)', '대지면적(㎡)', '연면적(㎡)', '층',
      '중개사', '구분', '확인일', '중복등록', '소유자', '설명', '매물URL'];
    var rows = [head.join(',')];
    list.forEach(function (d) {
      rows.push([d.id, d.trade, d.price, d.dong, d.sub, d.use, d.built, d.land, d.floorArea, d.floor,
        d.brokers, d.kind, d.day, d.dup ? d.dup + '곳' : '', d.owner, d.desc, d.url].map(cell).join(','));
    });
    var blob = new Blob(['\ufeff' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    var name = 'naver_listings_' + stamp() + '.csv';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
    return name;
  }

var fixture=[
 {id:'2661255107',trade:'월세',price:'월세 1억/500',dong:'초동',sub:'공장',use:'공장/창고',built:'2009.12(17년차)',land:'293.55',floorArea:'198.06',floor:'B3/B11층',brokers:'필공인중개사사무소 / 산업부동산',kind:'확인매물',day:'2026-11-12',dup:'',owner:'소유자',desc:'공장 용도. 이전 고민 끝. 소음.민원 걱정 덜고. 인허가 부담도 덜어요',url:'https://fin.land.naver.com/articles/2661255107'},
 {id:'2662594753',trade:'월세',price:'월세 1억/1,000',dong:'충무로4가',sub:'공장',use:'공장/창고',built:'2001.09(26년차)',land:'402.8',floorArea:'1569.59',floor:'6/B1층',brokers:'중앙공인중개사사무소 / 한경부동산',kind:'확인매물',day:'2026-11-18',dup:'3',owner:'',desc:'충무로 1층 공장 사무실 "하역주차" 편리',url:'https://fin.land.naver.com/articles/2662594753'},
 {id:'2659213329',trade:'매매',price:'매매 50억',dong:'인현동2가',sub:'창고',use:'공장/창고',built:'1960.01(67년차)',land:'159.3',floorArea:'89.25',floor:'2/-층',brokers:'서울공인중개사사무소',kind:'등록',day:'2026-11-02',dup:'',owner:'',desc:'1층,2층 전부 사용',url:'https://fin.land.naver.com/articles/2659213329'}
];
document.getElementById('go').addEventListener('click',function(){
  var name=save(fixture);
  document.getElementById('out').textContent='saved: '+name;
});
</script></body></html>
