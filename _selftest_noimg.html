<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>사진없음 카드 테스트</title>
<style>
  body{font-family:"Malgun Gothic",sans-serif;background:#eef2f7;margin:0;padding:16px;}
  canvas{width:520px;height:520px;border:1px solid #94a3b8;background:#fff;}
  iframe{position:absolute;left:-9999px;width:900px;height:600px;}
</style>
</head>
<body>
<div id="out"></div>
<iframe id="frame" src="./index.html"></iframe>
<script>
const p = {
  id: 'OLD-228', deal: '임대', region: '경서동', zone: '일반공업지역',
  title: '경서동 182평 210호 (사진 없는 매물 테스트)', price: '보증금 5,460만 / 월 546만',
  areaNum: 182, landInfo: '전용 182평', height: '', powerNum: 0, powerText: '확인문의',
  hasHoist: 'YES', hoist: '호이스트 2.8T', hasTrailer: 'WING', road: '8m 포장도로', roadRaw: '8m 포장도로',
  desc: '', imgs: []
};
document.getElementById('frame').addEventListener('load', () => {
  const w = document.getElementById('frame').contentWindow;
  w.buildKakaoCardCanvas(p).then(cv => {
    cv.style.width = '520px'; cv.style.height = '520px';
    document.getElementById('out').appendChild(cv);
  });
});
</script>
</body>
</html>
